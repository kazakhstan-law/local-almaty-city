    kaz: «Мұқтаж азаматтардың жекелеген санаттарына коммуналдық қызметтерге тарифтердің көтерілуіне байланысты әлеуметтік көмек көрсету және өтемақы төлеу мөлшерін белгілеу қағидаларын бекіту туралы» Алматы қаласы мәслихатының 2023 жылғы 9 тамыздағы № 37 шешіміне өзгеріс енгізу туралы
