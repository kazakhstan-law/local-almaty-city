title:
  rus: О признании утратившим силу решения акима Турксибского района города Алматы от 28 марта 2018 года № 01 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима Турксибского района города Алматы»
  kaz: Алматы қаласы Түрксіб ауданы әкімінің 2018 жылғы 28 наурыздағы «Алматы қаласы Түрксіб ауданы әкімі аппаратының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» № 01 шешімінің күшін жою туралы
