  title:
    rus: О внесении изменений и дополнения в решение маслихата города Алматы от 9 августа 2023 года № 37 «Об утверждении Правил оказания социальной помощи и установления размера выплаты компенсации отдельным категориям нуждающихся граждан в связи с повышением тарифов на коммунальные услуги»
    kaz: «Мұқтаж азаматтардың жекелеген санаттарына коммуналдық қызметтерге тарифтердің көтерілуіне байланысты әлеуметтік көмек көрсету және өтемақы төлеу мөлшерін белгілеу қағидаларын бекіту туралы» Алматы қаласы мәслихатының 2023 жылғы 9 тамыздағы № 37 шешіміне өзгерістер мен толықтыру енгізу туралы
