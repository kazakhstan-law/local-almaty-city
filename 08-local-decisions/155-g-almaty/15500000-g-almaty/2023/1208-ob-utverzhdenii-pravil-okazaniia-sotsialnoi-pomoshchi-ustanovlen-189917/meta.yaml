  title:
    rus: О внесении изменений и дополнений в решение маслихата города Алматы от 8 декабря 2023 года № 73 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в городе Алматы»
    kaz: «Алматы қаласында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Алматы қаласы мәслихатының 2023 жылғы 8 желтоқсандағы № 73 шешiмiне өзгерістер мен толықтырулар енгізу туралы
