title:
  rus: О признании утратившим силу решения акима Алатауского района города Алматы от 19 марта 2018 года № 1 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима Алатауского района города Алматы»
  kaz: Алматы қаласы Алатау ауданы әкімінің 2018 жылғы 19 наурыздағы «Алматы қаласы Алатау ауданы әкімі аппаратының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» № 1 шешімінің күшін жою туралы
