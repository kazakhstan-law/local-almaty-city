requisite: Решение акима Медеуского района города Алматы от 3 июля 2023 года № 06-01/01. Зарегистрировано в Департаменте юстиции города Алматы 4 июля 2023 года № 1726
title:
  rus: О признании утратившим силу решения акима Медеуского района города Алматы от 20 марта 2018 года № 06-01/01 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима Медеуского района города Алматы»
  kaz: Алматы қаласы Медеу ауданы әкімінің 2018 жылғы 20 наурыздағы «Алматы қаласы Медеу ауданы әкімі аппаратының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» № 06-01/01 шешімінің күшін жою туралы
