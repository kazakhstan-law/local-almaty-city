  title:
    rus: О признании утратившим силу решение маслихата города Алматы от 28 августа 2024 года № 146 «Об утверждении ставок ежемесячной платы за размещение наружной (визуальной) рекламы на территории города Алматы»
    kaz: «Алматы қаласының аумағында сыртқы (көрнекі) жарнаманы орналастырғаны үшін ай сайынғы төлемақы мөлшерлемелерін бекіту туралы» Алматы қаласы мәслихатының 2024 жылғы 28 тамыздағы № 146 шешімінің күші жойылды деп тану туралы
