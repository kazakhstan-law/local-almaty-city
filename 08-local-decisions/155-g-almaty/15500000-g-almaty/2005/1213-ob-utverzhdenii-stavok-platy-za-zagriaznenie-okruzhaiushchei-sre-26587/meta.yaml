act_code: '26587'
requisite: Решение XХ сессии Маслихата города Алматы III-го созыва N 205 от 13 декабря 2005 года. Зарегистрировано Департаментом юстиции города Алматы 28 января 2006 года за N 695. Утратило силу в связи с истечением срока действия - письмо Маслихата города Алматы от 13 апреля 2007 года N 368
title:
  rus: Об утверждении ставок платы за загрязнение окружающей среды, размеров компенсационной (восстановительной) стоимости вынужденного сноса зеленых насаждений по городу Алматы и ставок платы за использование особо охраняемой природной территории на 2006 год
  kaz: Алматы қаласы бойынша 2006 жылға арналған қоршаған ортаны ластағаны үшін төлемақы ставкаларын, жасыл желектерді еріксіз кескендегі үшін өтемдік (қалпына келтіру) құнының төлемдерін және ерекше қорғалатын табиғи аумақтарды пайдаланғаны үшін төлемақы ставкаларын бекіту туралы
