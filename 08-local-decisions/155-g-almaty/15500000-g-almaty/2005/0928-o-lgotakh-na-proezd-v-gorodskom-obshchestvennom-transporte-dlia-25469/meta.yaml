act_code: '25469'
requisite: Решение Маслихата города Алматы от 28 сентября 2005 года N 180. Зарегистрировано Департаментом юстиции города Алматы 30 сентября 2005 года за N 672. Утратило силу решением маслихата города Алматы от 18 января 2011 года N 395
title:
  rus: О льготах на проезд в городском общественном транспорте для учащихся очной формы обучения среднего общего, начального и среднего профессионального образования, высших профессиональных учебных заведений города Алматы, а также военнослужащих внутренних войск Министерства внутренних дел Республики Казахстан
  kaz: Алматы қаласының жалпы орта, бастауыш және орта кәсіптік оқу, жоғары кәсіптік оқу орындарының күндізгі оқу нысанындағы оқушылары, сондай-ақ Қазақстан Республикасы Ішкі істер министрлігі ішкі әскерлерінің әскери қызметшілері үшін қалалық қоғамдық көлікте жүру жеңілдіктері туралы
