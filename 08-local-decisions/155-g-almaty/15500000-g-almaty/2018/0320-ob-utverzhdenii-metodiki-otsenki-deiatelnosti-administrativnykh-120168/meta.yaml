requisite: Решение акима Медеуского района города Алматы от 20 марта 2018 года № 06-01/01. Зарегистрировано Департаментом юстиции города Алматы 3 апреля 2018 года № 1461. Утратило силу решением акима Медеуского района города Алматы от 3 июля 2023 года № 06-01/01 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
