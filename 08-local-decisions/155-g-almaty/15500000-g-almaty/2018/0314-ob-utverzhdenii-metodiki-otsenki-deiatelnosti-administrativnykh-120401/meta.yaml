requisite: Решение акима Жетысуского района города Алматы от 14 марта 2018 года № 01. Зарегистрировано Департаментом юстиции города Алматы 9 апреля 2018 года № 1462. Утратило силу решением акима Жетысуского района города Алматы от 9 августа 2023 года № 1 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
