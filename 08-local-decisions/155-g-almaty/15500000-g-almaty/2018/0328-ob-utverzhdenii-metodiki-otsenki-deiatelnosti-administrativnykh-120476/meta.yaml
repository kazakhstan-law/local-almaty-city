requisite: Решение акима Турксибского района города Алматы от 28 марта 2018 года № 01. Зарегистрировано Департаментом юстиции города Алматы 11 апреля 2018 года № 1468. Утратило силу решением акима Турксибского района города Алматы от 18 июля 2023 года № 01 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
