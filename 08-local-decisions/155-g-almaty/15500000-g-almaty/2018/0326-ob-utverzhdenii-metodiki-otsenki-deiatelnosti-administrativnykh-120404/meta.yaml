requisite: Решение акима Бостандыкского района города Алматы от 26 марта 2018 года № 02. Зарегистрировано Департаментом юстиции города Алматы 10 апреля 2018 года № 1465. Утратило силу решением акима Бостандыкского района города Алматы от 5 июля 2023 года № 06 (вводится в действие по истечении десяти календарных дней после его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима Бостандыкского района города Алматы
