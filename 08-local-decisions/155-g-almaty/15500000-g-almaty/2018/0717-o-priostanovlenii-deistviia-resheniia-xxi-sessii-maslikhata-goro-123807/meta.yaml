title:
  rus: О приостановлении действия решения XXI сессии маслихата города Алматы VI созыва от 15 сентября 2017 года № 146 «Об утверждении тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по городу Алматы»
  kaz: VІ сайланған Алматы қаласы мәслихаты ХХІ сессиясының «Алматы қаласы бойынша тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифті бекіту туралы» 2017 жылғы 15 қыркүйектегі № 146 шешімінің қолданылуын тоқтата тұру туралы
