requisite: Решение XVI сессии Алматинского городского Маслихата I созыва от 25 декабря 1997 года. Зарегистрировано Управлением юстиции города Алматы 13 января 1998 года за № 4a. Утратило силу решением Маслихата города Алматы 28 сентября 2005 года № 184
title:
  rus: О приведении постановлений III-й сессии Алматинского городского Маслихата-Собрания депутатов I-го созыва от 14 октября 1994 года "О вопросах оздоровления экологической обстановки города Алматы" и IV-й сессии от 7 февраля 1995 года по утверждению приложений № 7, 9 к постановлению III-й сессии в соответствие с законом Республики Казахстан "Об охране окружающей среды" от 15 июля 1997 года
  kaz: I сайланған Алматы қалалық Мәслихатының 1994 жылғы 14 қазандағы Алматы қаласының экологиялық ахуалын сауықтыру туралы III сессиясының Қаулысын және 1995 жылғы 7 ақпандағы IV сессиясының III сессия қаулысының № 7-9 қосымшасын 1997 жылғы 15 шiлдедегi "Қоршаған ортаны қорғау туралы" Қазақстан Республикасы Заңына сәйкестендiру туралы
