requisite: Решение акима города Алматы от 7 октября 1997 города N 569. Зарегистрировано Управлением юстиции города Алматы 22 января 1998 года № 6. Утратило силу решением акима города Алматы от 10 июля 1998 года N 662
title:
  rus: О Комиссии пo определению приоpитетныx проектов субъектов малого предпринимательствa города Алматы, рекомендуемых для финансирования и льготного кредитования из средств городского бюджета и других источников
  kaz: Қалалық бюджеттiң қаражаттары және басқа да кұздерден қаржыландыру және жеңiлдiктi несие қаржысын беру үшiн ұсынылатын, Алматы қаласындағы шағын кәсiпкерлiк субъектiлерiнiң басым жобаларын анықтау жұнiндегi комиссия құру туралы
