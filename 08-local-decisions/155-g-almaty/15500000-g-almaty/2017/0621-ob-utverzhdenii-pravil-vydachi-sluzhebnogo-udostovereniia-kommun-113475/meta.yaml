requisite: Решение акима Турксибского района города Алматы от 21 июня 2017 года № 03. Зарегистрировано Департаментом юстиции города Алматы 17 июля 2017 года № 1394. Утратило силу решением акима Турксибского района города Алматы от 27 июля 2020 года № 01 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи служебного удостоверения коммунального государственного учреждения "Аппарат акима Турксибского района города Алматы" и его описания
  kaz: '"Алматы қаласы Түрксіб ауданы әкімінің аппараты" коммуналдық мемлекеттік мекемесінің қызметтік куәлік беру қағидасын және оның сипаттамасын бекіту туралы'
