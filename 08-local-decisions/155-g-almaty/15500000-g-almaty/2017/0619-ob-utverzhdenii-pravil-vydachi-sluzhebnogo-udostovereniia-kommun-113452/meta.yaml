requisite: Решение акима Ауэзовского района города Алматы от 19 июня 2017 года № 02. Зарегистрировано Департаментом юстиции города Алматы 17 июля 2017 года № 1393. Утратило силу решением акима Ауэзовского района города Алматы от 5 августа 2020 года № 1 (вводится в действие по истечении десяти календарных дней после опубликования)
