act_code: '226446'
requisite: Решение очередной XLVI сессии маслихата города Алматы VIII созыва от 10 июня 2026 года № 313
title:
  rus: О социальной помощи на возмещение затрат на проезд в город Санкт-Петербург гражданам, работавшим на предприятиях, в учреждениях и организациях города Ленинграда в период его блокады и награжденным медалью «За оборону Ленинграда» или знаком «Житель блокадного Ленинграда», проживающим в городе Алматы
  kaz: Ленинград қаласындағы қоршау кезеңінде қаланың кәсіпорындарында, мекемелері мен ұйымдарында жұмыс істеген және «Ленинградты қорғағаны үшін» медалімен немесе «Қоршаудағы Ленинград тұрғыны» белгісімен наградталған Алматы қаласында тұратын азаматтарға Санкт-Петербург қаласына баруға кететін шығындарды өтеуге арналған әлеуметтік көмек туралы
