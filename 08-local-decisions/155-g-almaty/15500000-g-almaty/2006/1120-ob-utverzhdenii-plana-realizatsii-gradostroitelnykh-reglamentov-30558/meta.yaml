    kaz: «Алматы қаласы аумақтарының функционалдық аймақтарында құрылыс салудың қалақұрылыстық регламенттерін жүзеге асыру жоспарын бекіту туралы» ІІІ сайланған Алматы қаласы мәслихатының 2006 жылғы 20 қарашадағы XXVІ сессиясының № 284 шешіміне толықтыру енгізу туралы
