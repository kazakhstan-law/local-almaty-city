  title:
    rus: О внесении изменения и дополнений в решение маслихата города Алматы от 20 ноября 2006 года № 284 «Об утверждении Плана реализации градостроительных регламентов застройки функциональных зон территории города Алматы»
    kaz: «Алматы қаласы аумақтарының функционалдық аймақтарында құрылыс салудың қалақұрылыстық регламенттерін жүзеге асыру жоспарын бекіту туралы» Алматы қаласы мәслихатының 2006 жылғы 20 қарашадағы № 284 шешіміне өзгеріс пен толықтырулар енгізу туралы
