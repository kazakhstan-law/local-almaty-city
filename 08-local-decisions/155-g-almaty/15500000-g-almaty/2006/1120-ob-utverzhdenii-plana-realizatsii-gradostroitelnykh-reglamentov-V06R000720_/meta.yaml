    kaz: ІІІ сайланған Алматы қаласы мәслихатының XXVІ сессиясының «Алматы қаласы аумақтарының функционалдық аймақтарында құрылыс салудың қалақұрылыстық регламенттерін жүзеге асыру жоспарын бекіту туралы» 2006 жылғы 20 қарашадағы № 284 шешіміне өзгерістер енгізу туралы
