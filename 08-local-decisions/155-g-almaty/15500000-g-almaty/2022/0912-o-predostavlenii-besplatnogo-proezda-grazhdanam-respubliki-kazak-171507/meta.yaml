act_code: '171507'
requisite: Решение внеочередной ХХV сессии маслихата города Алматы VII созыва от 12 сентября 2022 года № 156. Зарегистрировано Министерством юстиции Республики Казахстан 12 сентября 2022 года № 29510
title:
  rus: О предоставлении бесплатного проезда гражданам Республики Казахстан постоянно проживающим в городе Алматы за пределы населенного пункта для получения высокотехнологичных медицинских услуг в рамках гарантированного объема бесплатной медицинской помощи и (или) медицинской помощи в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде жоғары технологиялық медициналық көрсетілетін қызметтерді және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмекті алу үшін Алматы қаласында тұрақты тұратын Қазақстан Республикасының азаматтарына елді мекеннен тысқары жерлерге тегін жол жүруді ұсыну туралы
