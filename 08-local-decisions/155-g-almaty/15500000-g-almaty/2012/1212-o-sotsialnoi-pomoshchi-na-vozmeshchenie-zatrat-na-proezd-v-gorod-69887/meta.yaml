act_code: '69887'
requisite: Решение ХI сессии Маслихата города Алматы V созыва от 12 декабря 2012 года N 82. Зарегистрировано в Департаменте юстиции города Алматы 08 января 2013 года за N 960. Утратило силу решением маслихата города Алматы от 9 октября 2020 года № 488 (вводится в действие со дня его первого официального опубликования)
title:
  rus: О социальной помощи на возмещение затрат на проезд в город Санкт-Петербург гражданам, работавшим на предприятиях, в учреждениях и организациях города Ленинграда в период его блокады и награжденным медалью "За оборону  Ленинграда" и знаком "Житель блокадного Ленинграда", проживающим в городе Алматы
  kaz: Қоршаудағы кезенінде Ленинград қаласының кәсіпорындарында, мекемелері мен ұйымдарында жұмыс істеген және "Ленинградты қорғағаны үшін" медалімен әрі "Қоршаудағы Ленинград тұрғыны" белгісімен марапатталған Алматы қаласында тұратын азаматтарға Санкт-Петербург қаласына баруға кететін шығындарды өтеуге арналған әлеуметтік көмек туралы
