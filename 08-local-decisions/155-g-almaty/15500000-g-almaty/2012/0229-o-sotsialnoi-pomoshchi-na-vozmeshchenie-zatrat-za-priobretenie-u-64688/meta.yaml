  title:
    rus: О внесении дополнения в решение маслихата города Алматы III-й сессии V-го созыва от 29 февраля 2012 года № 10 "О социальной помощи на возмещение затрат за приобретение, установку или поверку индивидуальных приборов учета горячего и (или) холодного водоснабжения отдельным категориям нуждающихся  граждан города Алматы"
    kaz: Алматы қаласы мәслихатының V сайланған ІІІ сессиясының "Алматы қаласының мұқтаж азаматтарының жекелеген санаттарына ыстық және (немесе) суық сумен жабдықтаудың есептеуіш құралдарын сатып алу, орнату немесе тексеруден өткізу шығындарын өтеуге арналған әлеуметтік көмек көрсету туралы" 2012 жылғы 29 ақпандағы № 10 шешіміне толықтыру енгізу туралы
