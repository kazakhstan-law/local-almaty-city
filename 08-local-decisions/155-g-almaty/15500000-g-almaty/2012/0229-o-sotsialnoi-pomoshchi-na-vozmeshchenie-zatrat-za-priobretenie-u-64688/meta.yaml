requisite: Решение III сессии маслихата города Алматы V созыва от 29 февраля 2012 года № 10. Зарегистрировано в Департаменте юстиции города Алматы 12 апреля 2012 года за № 932. Действие решения отменено решением маслихата города Алматы от 18 февраля 2014 года № 204
title:
  rus: О социальной помощи на возмещение затрат за приобретение, установку или поверку индивидуальных приборов учета горячего и (или) холодного водоснабжения отдельным категориям нуждающихся граждан города Алматы
  kaz: Алматы қаласының мұқтаж азаматтарының жекелеген санаттарына ыстық және (немесе) суық сумен жабдықтаудың есептеуіш құралдарын сатып алу, орнату немесе тексеруден өткізу шығындарын өтеуге арналған әлеуметтік көмек көрсету туралы
