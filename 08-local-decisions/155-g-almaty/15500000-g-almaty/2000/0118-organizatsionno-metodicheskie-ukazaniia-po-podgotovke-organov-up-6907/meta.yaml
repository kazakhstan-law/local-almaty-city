act_code: '6907'
requisite: Решение Акима города Алматы от 18 января 2000 года N 46. Зарегистрировано Управлением юстиции города Алматы за N 170 от 21 августа 2000 года. Утратило силу постановлением Акимата города Алматы от 31 декабря 2003 года N 5/778
title:
  rus: Организационно-методические указания по подготовке органов управления и сил ГО и ЧС города Алматы действиям в чрезвычайных ситуациях в 2000 и 2001 годах
  kaz: '"Алматы қаласының басқару органдары мен Азаматтық қорғаныс және төтенше жағдайлар күштерiн 2000 және 2001 жылдары төтенше жағдайлардағы даярлығы жөнiндегi ұйымдастыру-әдiстемелiк нұсқаулық"'
