requisite: Решение V-й сессии Алматинского городского маслихата II-го созыва от 2 июня 2000 года. Зарегистрировано Управлением юстиции города Алматы 20 июня 2000 года № 133. Утратило силу в связи с истечением срока действия - решением маслихата города Алматы от 12 апреля 2010 года № 322
title:
  rus: О выполнении Закона Республики Казахстан "Об образовании" от 7 июня 1999 года № 389-1, Указов Президента Республики Казахстан, постановлений Правительства Республики Казахстан по данному вопросу в городе Алматы
  kaz: Қазақстан Республикасының 1999 жылғы 7 маусымдағы № 389-1 "Білім туралы" Заңының, осы мәселе бойынша Қазақстан Республикасы Президенті жарлықтарының, Қазақстан Республикасы Үкіметі қаулыларының Алматы қаласында орындалу барысы туралы
