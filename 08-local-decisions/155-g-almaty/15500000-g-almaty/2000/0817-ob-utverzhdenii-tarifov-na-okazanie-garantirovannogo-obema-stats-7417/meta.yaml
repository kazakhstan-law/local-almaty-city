requisite: Решение Акима города Алматы от 18 августа 2000 года № 806. Зарегистрировано Управлением юстиции города Алматы за № 209 от 20 октября 2000 года. Утратило силу постановлением Акимата города Алматы от 31 декабря 2003 года № 5/778
title:
  rus: Об утверждении тарифов на оказание гарантированного объема стационарной и амбулаторно-поликлинической медицинской помощи с комплексом диагностических услуг населению города Алматы на 2-е полугодие 2000 года
  kaz: '"Алматы қ. халқына 2000 ж. 2-жарты жылында стационарлық және кешендi диагностикалық қызметпен қоса амбулаторлық-емханалық медициналық көмектiң кепiлдемелi көлемiн көрсетуге тариф бекiту туралы"'
