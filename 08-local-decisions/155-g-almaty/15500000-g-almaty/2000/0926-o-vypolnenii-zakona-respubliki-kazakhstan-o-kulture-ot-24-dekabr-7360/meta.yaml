requisite: Решение VI сессии Алматинского городского Маслихата II созыва от 27 сентября 2000 года. Зарегистрировано управлением юстиции города Алматы 20 октября 2000 года за № 204. Утратило силу решением VIII сессии Алматинского городского Маслихата II-го созыва № 76 от 29 июля 2004 года
title:
  rus: О выполнении закона Республики Казахстан "О культуре" от 24 декабря 1996 года № 56-1, указа Президента Республики Казахстан "Об объявлении 2000 года Годом поддержки культуры", постановлений Правительства Республики Казахстан по данному вопросу в городе Алматы
  kaz: Қазақстан Республикасының 1996 жылғы 24 желтоқсандағы N 56-1 "Мәдениет туралы" Заңының, Қазақстан Республикасы Президентiнiң "2000 жылды Мәдениеттi қолдау жылы деп жариялау туралы" Жарлығының, Қазақстан Республикасы Үкiметiнiң осы мәселе бойынша Қаулыларының Алматы қаласында орындалуы туралы
