act_code: '5657'
requisite: Решение IV-й сессии Алматинского городского маслихата II-го созыва от 10 марта 2000 года. Зарегистрировано Управлением юстиции города Алматы 24 марта 2000 года № 108. Утратило силу решением VIII сессии Алматинского городского маслихата II созыва от 29 июля 2004 года № 76
title:
  rus: О включении статьи расходов бюджета города Алматы на 2000 год на обслуживание долга по облигационному займу города Алматы в перечень защищенных (несеквестрируемых) статей и выделению отдельной строкой расходов по данному займу
  kaz: Алматы қаласының облигациялық займ бойынша қарызына қызмет көрсетуге арналған Алматы қаласының 2000 жылғы бюджетінің шығыстар бабын қорғалған (қысқартылмайтын) баптар тізбесіне енгізу және осы займ бойынша шығыстарды жеке жолмен бөліп көрсету туралы
