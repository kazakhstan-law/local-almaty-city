    kaz: ІІ сайланған Алматы қалалық Мәслихатының 2000 жылғы 27 қыркүйектегі "Алматы қаласын басқару және Қазақстан Республикасы министрліктерінің, ведомстволарының және комитеттерінің аумақтық органдарымен өзара байланыс схемасын бекіту туралы" VI-сессиясының шешіміне өзгерістер мен толықтырулар енгізу туралы
