act_code: '10559'
requisite: Решение XIII сессии Алматинского городского Маслихата II созыва от 31 октября 2001 года. Зарегистрировано Управлением юстиции города Алматы 20 ноября 2001  года за № 404. Утратило силу постановлением Алматинского городского Маслихата от 20 апреля 2004 года N 54
title:
  rus: О временном приостановлении действия подпунктов 2,3,4 пункта 2.5 приложения к решению XXV-й сессии Алматинского городского Маслихата I-го созыва от 14 мая 1999 года "Об утверждении Комплексной программы оздоровления экологической обстановки города Алматы "Таза ауа-Жанга дауа" на 1999-2015 годы" до 2005 года
  kaz: '"1999-2015 жылдарға арналған "Таза ауа-Жанға дауа" Алматы қаласының экологиялық ахуалуын сауықтырудың кешендi бағдарламасын бекiту туралы" I-сайланған Алматы қалалық Мәслихатының 1999 жылғы 14 мамырдағы XXV-сессиясының шешiмiне қосымшаның 2.5 тармағының 2, 3, 4 тармақшаларының күшiн 2005 жылға дейiн уақытша тоқтата тұру туралы'
