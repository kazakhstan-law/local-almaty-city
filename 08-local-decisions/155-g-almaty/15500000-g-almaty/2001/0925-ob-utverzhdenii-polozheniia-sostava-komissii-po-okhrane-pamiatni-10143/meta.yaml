requisite: Решение ХII сессии Алматинского городского маслихата II созыва от 26 сентября 2001 года. Зарегистрировано Управлением юстиции города Алматы 3 октября 2001 года N 391. Утратило силу в связи с истечением срока применения - решение маслихата города Алматы от 24 сентября 2010 года N 358
title:
  rus: Об утверждении положения, состава комиссии по охране памятников истории и культуры города Алматы и придании вновь сооруженным памятникам статуса памятников истории и культуры местного значения
  kaz: Алматы қаласының тарих және мәдениет ескерткiштерiн қорғау жөніндегі ережені, комиссияның құрамын бекіту және жаңадан тұрғызылған ескерткiштерге жергiлiктi маңыздағы тарих мәдениет ескерткiштері мәртебесiн беру туралы
