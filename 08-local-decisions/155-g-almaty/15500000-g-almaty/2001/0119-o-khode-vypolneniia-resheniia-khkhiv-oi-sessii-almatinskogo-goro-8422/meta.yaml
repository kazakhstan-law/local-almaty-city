act_code: '8422'
requisite: Решение VIII сессии Алматинского городского Маслихата II созыва от 19 января 2001 года. Зарегистрировано управлением юстиции города Алматы 7 марта 2001 года за N 297. Утратило силу решением N 123 внеочередной XIII сессии Маслихата города Алматы от 11 февраля 2005 года
title:
  rus: О ходе выполнения решения ХХIV-ой сессии Алматинского городского Маслихата I-го созыва от 12 марта 1999 года "О выполнении Закона Республики Казахстан "О государственной поддержке малого предпринимательства", указов Президента, постановлений Правительства Республики Казахстан по данному вопросу в городе Алматы и мерах по дальнейшему развитию малого бизнеса
  kaz: І-сайланған Алматы қалалық Мәслихатының Алматы қаласында "Шағын кәсіпкерлікті мемлекеттік қолдау туралы" Қазақстан Республикасы Заңының орындалу барысы туралы ХХІV-сессиясы шешімінің, осы мәселе бойынша Қазақстан Республикасы Президенті Жарлықтарының, Қазақстан Республикасы Үкіметі қаулыларының орындалу барысы және шағын бизнесті бұдан әрі дамыту жөніндегі шаралар туралы
