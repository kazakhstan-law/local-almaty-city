title:
  rus: О заимствовании средств путем выпуска муниципальных облигаций на финансирование Местного инвестиционного проекта города Алматы на 2003 год "Строительство жилья для широких слоев населения в городе Алматы"
  kaz: Алматы қаласының 2003 жылға арналған "Алматы қаласында қалың бұқара топтары үшiн тұрғын үй салудың" жергiлiктi инвестициялық жобасын қаржыландыруға муниципиалдық облигация шығару жолымен шеттен қаражат алып пайдалану туралы
