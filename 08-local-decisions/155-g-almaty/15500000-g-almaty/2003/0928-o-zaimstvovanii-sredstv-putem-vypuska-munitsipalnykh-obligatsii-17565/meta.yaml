    kaz: 2003 жылғы 29 қыркүйектегі ІІ-сайланған Алматы қалалық Мәслихаты ХХVІІІ-сессиясының "Алматы қаласындағы тұрғындардың кең топтарына арналған тұрғын-үй құрылысына" Алматы қаласының 2003 жылға арналған жергілікті инвестициялық жобаны қаржыландыруға муниципалдық облигацияны шығару жолмен қаражатты игеру" шешіміне өзгерістер енгізу туралы"
