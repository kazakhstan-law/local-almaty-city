requisite: Решение IV сессии Алматинского городского Маслихата III созыва N 17 от 24 декабря 2003 года. Зарегистрировано Управлением юстиции города Алматы 31 декабря 2003 года за N 576. Утратило силу в связи с истечением срока действия в соответствии с подпунктом 1 пункта 2 статьи 40 закона Республики Казахстан "О нормативных правовых актах" и письмом Маслихата города Алматы от 19 мая 2005 года N 559
title:
