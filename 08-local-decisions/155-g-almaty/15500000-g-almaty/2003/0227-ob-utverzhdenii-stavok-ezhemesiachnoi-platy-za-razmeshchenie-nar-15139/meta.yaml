    kaz: '"Алматы қаласының аумағында сыртқы (көрнекi) жарнаманы орналастырғандығы үшiн ай сайынғы төлем мөлшерлемелерiн бекiту туралы" II-сайланған Алматы қалалық Мәслихатының 2003 жылғы 27 ақпандағы ХХI-сессиясының шешiмiне толықтырулар енгiзу туралы'
