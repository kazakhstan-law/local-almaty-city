    kaz: ІІ-сайланған Алматы қаласы Мәслихатының 2003 жылғы 27 ақпандағы ХХІV-сессиясының "Алматы қаласының аумағында сыртқы (көрнекі) жарнаманы орналастырғаны үшін ай сайынғы төлемнің мөлшермелерін бекіту туралы" шешіміне өзгерістер мен толықтырулар енгізу туралы
