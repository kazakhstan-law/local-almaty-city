  title:
    rus: О внесении дополнений в решение XXIV-й сессии Алматинского городского маслихата II-го созыва от 27 февраля 2003 года "Об утверждении ставок ежемесячной платы за размещение наружной (визуальной) рекламы на территории города Алматы"
    kaz: ІІ сайланған Алматы қаласы мәслихатының 2003 жылғы 27 ақпандағы ХХІV сессиясының "Алматы қаласының аумағында сыртқы (көрнекі) жарнаманы орналастырғаны үшін ай сайынғы төлемнің мөлшерлемелерін бекіту туралы" шешіміне толықтырулар енгізу туралы
