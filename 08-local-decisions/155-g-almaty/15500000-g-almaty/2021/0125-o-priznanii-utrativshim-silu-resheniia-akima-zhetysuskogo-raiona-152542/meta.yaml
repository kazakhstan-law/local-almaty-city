requisite: Решение акима Жетысуского района города Алматы от 25 января 2021 года № 1. Зарегистрировано Департаментом юстиции города Алматы 26 января 2021 года № 1681
title:
  rus: О признании утратившим силу решения акима Жетысуского района города Алматы от 06 июня 2017 года № 05 «Об утверждении Правил выдачи служебного удостоверения коммунального государственного учреждения «Аппарат акима Жетысуского района города Алматы» и его описания»
  kaz: Алматы қаласы Жетісу ауданы әкімінің 2017 жылғы 06 маусымдағы «Алматы қаласы Жетісу ауданы әкімінің аппараты» коммуналдық мемлекеттік мекемесінің қызметтік куәлік беру қағидасын және оның сипаттамасын бекіту туралы» № 05 шешімінің күшін жою туралы
