act_code: '33824'
requisite: Решение XXХ сессии Маслихата города Алматы III созыва от 5 июня 2007 года N 353. Зарегистрировано в Департаменте юстиции города Алматы 25 июня 2007 года за N 747. Утратило силу решением Маслихата города Алматы от 14 сентября 2012 года № 56
title:
  rus: О дополнительных льготах, предоставляемых гражданам, работавшим на предприятиях, в учреждениях и организациях города Ленинграда в период его блокады и награжденным медалью "За оборону Ленинграда" и знаком "Житель блокадного Ленинграда", проживающим в городе Алматы
  kaz: Ленинград құрсауда болған кезеңде қаланың кәсіпорындарында, мекемелері мен ұйымдарында жұмыс жасаған және "Ленинградты қорғағаны үшін" медалі мен "Құрсаудағы Ленинград тұрғыны" белгісімен марапатталған Алматы қаласында тұратын азаматтарға қосымша берілетін жеңілдіктер туралы
