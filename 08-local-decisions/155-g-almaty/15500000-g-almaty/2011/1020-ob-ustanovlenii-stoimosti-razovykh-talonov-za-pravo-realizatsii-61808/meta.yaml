act_code: '61808'
requisite: Решение XXХXVIII-й сессии маслихата города Алматы IV-го созыва от 20 октября 2011 года N 475. Зарегистрировано в Департаменте юстиции города Алматы 1 декабря 2011 года за N 904. Утратило силу решением Маслихата города Алматы от 12 декабря 2012 года № 85
title:
  rus: Об установлении стоимости разовых талонов за право реализации товаров, выполнения работ, оказания услуг на рынках города Алматы, а также за право осуществления деятельности, носящей эпизодический характер
  kaz: Алматы қаласының базарларында тауарларды өткізу, жұмыстарды орындау, қызметтерді көрсету, сонымен қатар, кезеңдік сипаттағы кәсіпкерлік қызметті жүзеге асыру құқығына арналған бір жолғы талондардың құнын белгілеу туралы
