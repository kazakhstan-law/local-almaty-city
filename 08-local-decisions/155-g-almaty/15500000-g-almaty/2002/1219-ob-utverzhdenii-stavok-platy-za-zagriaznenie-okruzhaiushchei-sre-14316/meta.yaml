act_code: '14316'
requisite: Решение XXII сессии Алматинского городского Маслихата II созыва от 19 декабря 2002 года. Зарегистрировано Управлением юстиции города Алматы 8 января 2003 года за N 505. Утратило силу в связи с истечением срока действия в соответствии с подпунктом 1 пункта 2 статьи 40 закона Республики Казахстан "О нормативных правовых актах" и письмом Маслихата города Алматы от 19 мая 2005 года N 559
title:
  rus: Об утверждении ставок платы за загрязнение окружающей среды по городу Алматы и ставок платы за использование особо охраняемой природной территории на 2003 год
  kaz: Алматы қаласы бойынша қоршаған ортаны ластануы жөніндегі төлемдер мөлшемелері және ерекше қорғалатын табиғи аумақтық Медеу мемлекеттік табиғи паркін пайдаланған үшін 2003 жылға арналған төлемдер мөлшемелерін бекіту туралы
