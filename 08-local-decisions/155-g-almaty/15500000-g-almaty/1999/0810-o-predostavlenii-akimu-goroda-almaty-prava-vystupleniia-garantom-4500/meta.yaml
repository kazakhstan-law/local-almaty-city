requisite: Решение XXVIII сессии Алматинского городского Маслихата I созыва от 11 августа 1999 года. Зарегистрировано управлением юстиции города Алматы 26.10.1999 г. за № 76. Утратило силу решением VIII сессии Алматинского городского Маслихата II-го созыва № 76 от 29 июля 2004 года
title:
  rus: О предоставлении акиму города Алматы права выступления гарантом средствами городского бюджета 2000 года по проведению расчетов между ЗАО "Алматыгоргаз" и ОАО "Казахстантрактор" по договору № К-Г-1 от 29 июля 1999 года
  kaz: Алматы қаласының Әкiмiне "Алматықалагаз" ЖАҚ пен "Қазақстантрактор" ААҚ арасындағы 1999 жылғы 29 шiлдедегi N К-Г-1 шарт бойынша есепайырысу жөнiнде 2000 жылғы қала бюджетiнiң қаражатына кепiл болу құқығын беру туралы
