  title:
    rus: О внесении изменений и дополнений в решение VI-й  сессии Алматинского городского Маслихата II-го созыва от 27.10.2000г. "О внесении изменений и дополнений в решение III-й сессии Алматинского городского Маслихата II-го созыва" "О бюджете города Алматы на 2000 год"
    kaz: '"II сайланған Алматы қалалық Мәслихатының III сессиясының "2000 жылға арналған Алматы қаласының бюджетi туралы" шешiмiне өзгерiстер мен толықтырулар енгiзу туралы" ІI сайланған Алматы қалалық Мәслихатының 2000 жылғы 27 қыркүйектегі VI сессиясының өзгерiстер мен толықтырулар енгiзу туралы'
