requisite: Решение XXV сессии Алматинского городского маслихата I созыва от 14 мая 1999 года. Зарегистрировано Управлением юстиции города Алматы от 11 июня 1999 года N 62. Утратило силу в связи с истечением срока применения - решение маслихата города Алматы от 24 сентября 2010 года N 358
title:
  rus: Об утверждении схемы "Оценочное зонирование функциональной стоимости территорий города Алматы", ставок земельного налога и границ селитебной территории
  kaz: '"Алматы қаласы аумақтарының функционалдық құнының бағамдық аудандастырылуының" схемасын, жер салығының ставкаларын және селитебтік аумақтың шекараларын бекiту туралы'
