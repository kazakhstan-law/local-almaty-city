requisite: Решение ХХIV-й сессии Алматинского городского маслихата I-го созыва от 12 марта 1999 года. Зарегистрировано Управлением юстиции города Алматы от 20 апреля 1999 года № 42. Утратило силу решением маслихата города Алматы от 11 февраля 2005 года № 123
title:
  rus: О выполнении Закона Республики Казахстан "О государственной поддержке малого предпринимательства" от 19-го июня 1997 года № 131-1, указов Президента, постановлений Правительства Республики Казахстан по данному вопросу в городе Алматы
  kaz: Қазақстан Республикасының 1997 жылғы 19 маусымдағы "Шағын кәсiпкерлiктi мемлекеттiк қолдау туралы" N 131-1 Заңының, осы мәселе бойынша Президенттiң жарлықтарының, Қазақстан Республикасы Үкiметiнiң қаулыларының Алматы қаласында орындалу барысы туралы
