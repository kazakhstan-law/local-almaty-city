requisite: Решение Акима города Алматы от 31 мая 1999 года N 490. Зарегистрировано Управлением юстиции города Алматы 23 января 2001 года за N 276. На основании письма Департамента юстиции города Алматы от 20 января 2005 года N 02-11/227 решение не подлежит государственной регистрации нормативных правовых актов, предусмотренной ст.38 Закона Республики Казахстан "О нормативных правовых актах" и применяется без нее. Утратило силу решением Акима города Алматы от 7 марта 2006 года N 33
