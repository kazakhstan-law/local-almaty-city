    kaz: '"1999–2015 жылдарға арналған "Таза ауа - Жанға дауа" Алматы қаласының экологиялық ахуалын сауықтырудың кешендi бағдарламасын бекiту туралы" I-сайланған Алматы қалалық Мәслихатының 1999 жылғы 14 мамырдағы XXV-сессиясының шешiмiне өзгерiстер мен толықтырулар енгiзу туралы'
