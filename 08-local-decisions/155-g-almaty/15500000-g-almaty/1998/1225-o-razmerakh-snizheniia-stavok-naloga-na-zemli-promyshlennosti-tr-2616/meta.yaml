act_code: '2616'
requisite: Решение XXIII сессии Алматинского городского Маслихата I созыва от 25 декабря 1998 года. Зарегистрировано управлением юстиции города Алматы от 17 января 1999 года за № 31. Утратило силу решением VIII сессии Алматинского городского Маслихата II-го созыва от 29 июля 2004 года № 76
title:
  rus: О размерах снижения ставок налога на земли промышленности, транспорта, связи и иного несельскохозяйственного назначения (включая шахты, карьеры и их санитарно-защитные, технические и иные зоны), расположенные в черте города Алматы, но за пределами селитебной территории
  kaz: Алматы қаласының шегiнде, алайда селитебтiк аумақтан тысқары орналасқан өнеркәсiп, көлiк, байланыс және ауыл шаруашылығы емес мақсаттағы жерлер (шахталарды, карьерлердi және олардың санитарлық-қорғаныс, техникалық басқа аймақтарды қоса алғанда) үшiн салық ставкасын төмендету көлемi туралы
