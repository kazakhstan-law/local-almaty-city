act_code: '416'
requisite: Решение Акима города Алматы от 22 января 1998 года N 25. Зарегистрировано управлением юстиции города Алматы 22 января 1998 года за № 7. Утратило силу постановлением Акимата города Алматы от 28 марта 2012 года № 1/211
title:
  rus: О создании государственного коммунального жилищного фонда акима города, утверждении образца ордера на занятие жилища данного фонда и создании отдела по эксплуатации жилищного фонда в Департаменте жилья
  kaz: Алматы қаласы әкiмiнiң мемлекеттiк коммуналдық тұрғын үй қорын құру, осы қордың тұрғын жайына қоныстануға берiлетiн ордердiң үлгiсiн бекiту және Тұрғын үй департаментiнде тұрғын үй қорын пайдалану бөлiмiн құру туралы
