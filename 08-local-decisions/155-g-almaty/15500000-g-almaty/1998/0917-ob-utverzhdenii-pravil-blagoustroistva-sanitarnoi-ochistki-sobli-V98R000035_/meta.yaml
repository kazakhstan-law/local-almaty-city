  title:
    rus: О внесении изменений и дополнений в решение XXI-й сессии Алматинского городского Маслихата I-го созыва от 18 сентября 1998 года "Об утверждении правил благоустройства, санитарной очистки, соблюдения чистоты и организации уборки территорий города Алматы"
    kaz: I-шi сайланған Алматы қалалық Мәслихаты ХХI сессиясының 1998 жылғы 18 қыркүйектегi "Алматы қаласы аумағын жинауды ұйымдастыру және тазалықты сақтау, санитарлық тазалау, көрiктендiру Ережелерiн бекiту туралы" шешiмiне өзгерiстер мен толықтырулар енгiзу туралы"
