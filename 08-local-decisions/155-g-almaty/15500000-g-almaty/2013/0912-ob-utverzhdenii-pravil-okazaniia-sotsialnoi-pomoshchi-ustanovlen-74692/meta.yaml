  title:
    rus: О внесении изменения в решение XIХ-й сессии маслихата города Алматы V-го созыва от 12 сентября 2013 года № 175 "Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в городе Алматы"
    kaz: V сайланған Алматы қаласы мәслихатының ХІХ сессиясының 2013 жылғы 12 қыркүйектегі № 175 "Алматы қаласында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы" шешіміне өзгеріс енгізу туралы
