title:
  rus: О признании утратившим силу решения акима Медеуского района города Алматы от 3 июля 2018 года  № 06-01/02 «Об утверждении Правил выдачи служебного удостоверения коммунального государственного учреждения «Аппарат акима Медеуского района города Алматы» и его описания»
  kaz: Алматы қаласы Медеу ауданы әкімінің 2018 жылғы 3 шілдедегі «Алматы қаласы Медеу ауданы әкімінің аппараты» коммуналдық мемлекеттік мекемесінің қызметтік куәлік беру қағидасын және оның сипаттамасын бекіту туралы» № 06-01/02 шешімінің күшін жою туралы
