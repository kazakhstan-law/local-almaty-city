title:
  rus: О признании утратившим силу решения акима Бостандыкского района города Алматы от 08 июня 2017 года № 04 «Об утверждении Правил выдачи служебного удостоверения коммунального государственного учреждения «Аппарат акима Бостандыкского района города Алматы» и его описания»
  kaz: Алматы қаласы Бостандық ауданы әкімінің 2017 жылғы 08 маусымындағы «Алматы қаласы Бостандық ауданы әкімінің аппараты» коммуналдық мемлекеттік мекемесінің қызметтік куәлік беру қағидасын және оның сипаттамасын бекіту туралы» № 04 шешімінің күшін жою туралы
