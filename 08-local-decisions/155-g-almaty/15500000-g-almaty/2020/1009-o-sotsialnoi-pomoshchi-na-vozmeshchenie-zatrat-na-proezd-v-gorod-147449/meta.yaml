  title:
    rus: О внесении изменения и дополнения в решение маслихата города Алматы от 9 октября 2020 года № 488 «О социальной помощи на возмещение затрат на проезд в город Санкт-Петербург гражданам, работавшим на предприятиях, в учреждениях и организациях города Ленинграда в период его блокады и награжденным медалью «За оборону Ленинграда» или знаком «Житель блокадного Ленинграда», проживающим в городе Алматы»
    kaz: «Ленинград қаласындағы қоршау кезеңінде қаланың кәсіпорындарында, мекемелері мен ұйымдарында жұмыс істеген және «Ленинградты қорғағаны үшін» медалімен немесе «Қоршаудағы Ленинград тұрғыны» белгісімен наградталған Алматы қаласында тұратын азаматтарға Санкт-Петербург қаласына баруға кететін шығындарды өтеуге арналған әлеуметтік көмек туралы» Алматы қаласы мәслихатының 2020 жылғы 9 қазандағы № 488 шешіміне өзгеріс пен толықтыру енгізу туралы
