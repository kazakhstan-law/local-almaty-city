title:
  rus: О признании утратившим силу решения акима Турксибского района города Алматы от 21 июня 2017 года № 03 «Об утверждении Правил выдачи служебного удостоверения коммунального государственного учреждения «Аппарат акима Турксибского района города Алматы» и его описания»
  kaz: Алматы қаласы Түрксіб ауданы әкімінің 2017 жылғы 21 маусымдегі «Алматы қаласы Түрксіб ауданы әкімінің аппараты» коммуналдық мемлекеттік мекемесінің қызметтік куәлік беру қағидасын және оның сипаттамасын бекіту туралы» № 03 шешімінің күшін жою туралы
