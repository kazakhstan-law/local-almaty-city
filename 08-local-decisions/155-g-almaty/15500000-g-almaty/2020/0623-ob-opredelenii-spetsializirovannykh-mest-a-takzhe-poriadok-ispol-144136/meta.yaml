    kaz: «Алматы қаласындағы бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, сондай-ақ арнайы орындарды пайдалану тәртібін айқындау туралы» Алматы қаласы мәслихатының 2020 жылғы 23 маусымдағы № 462 шешіміне өзгеріс енгізу туралы
