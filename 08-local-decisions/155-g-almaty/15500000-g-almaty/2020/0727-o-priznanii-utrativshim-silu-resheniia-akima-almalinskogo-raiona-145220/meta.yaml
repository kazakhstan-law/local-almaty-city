title:
  rus: О признании утратившим силу решения акима Алмалинского района города Алматы от 30 мая 2017 года № 06 «Об утверждении Правил выдачи служебного удостоверения коммунального государственного учреждения «Аппарат акима Алмалинского района города Алматы» и его описания»
