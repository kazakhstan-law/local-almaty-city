  title:
    rus: О внесении изменения в решение маслихата города Алматы от 30 октября 2020 года № 497 «О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Республики Казахстан, зарегистрированным в городе Алматы при амбулаторном лечении бесплатно»
    kaz: «Алматы қаласында тіркелген Қазақстан Республикасы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, арнайы емдік өнімдерді, медициналық бұйымдарды қосымша тегін беру туралы» Алматы қаласы мәслихатының 2020 жылғы 30 қазандағы № 497 шешіміне өзгеріс енгізу туралы
