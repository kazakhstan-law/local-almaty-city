  title:
    rus: О внесении изменений и дополнений в решение маслихата города Алматы от 18 марта 2020 года № 431 «Об определении перечня социально значимых сообщений в городе Алматы на 2020-2022 годы»
    kaz: «Алматы қаласындағы 2020-2022 жылдарға арналған әлеуметтік маңызы бар қатынастардың тізбесін айқындау туралы» Алматы қаласы мәслихатының 2020 жылғы 18 наурыздағы № 431 шешіміне өзгерістер мен толықтырулар енгізу туралы
