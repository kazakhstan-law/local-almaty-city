  title:
    rus: О внесении изменений в решение маслихата города Алматы от 23 июля 2015 года № 347 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в городе Алматы»
    kaz: Алматы қаласы мәслихатының 2015 жылғы 23 шілдедегі № 347 «Алматы қаласында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
