act_code: '19697'
requisite: Решение Алматинского городского Маслихата от 20 апреля 2004 года N 54. Зарегистрировано Департаментом юстиции города Алматы 4 мая 2004 года за N 597. Утратило силу решением VI сессии Маслихата города Алматы IV созыва от 12 декабря 2007 года N 56
title:
  rus: О временном приостановлении действия подпунктов 3, 4, 5 пункта 1.11.1 приложения к решению XXV-й сессии Алматинского городского Маслихата I-го созыва от 14 мая 1999 года "Об утверждении Комплексной программы оздоровления экологической обстановки города Алматы  "Таза ауа - Жанга дауа" на 1999-2015  годы"  до 2015 года зарегистрировано в Управлении юстиции города Алматы № 57 от 11.06.99 года, внесены изменения и дополнения решениями Алматинского городского Маслихата II-го созыва ХIII-й сессии от 31.10.2001 года (зарегистрировано 20.11.2001г № 404), ХV-й сессии от 23.01.2002 года (зарегистрировано 22.02.2002 года № 436), опубликованы в газетах "Вечерний Алматы" от 03.11.2001 года, 16.03.2002 года, "Алматы Акшамы"  от 03.11.2001 года
  kaz: '"1999-2015 жылдарға арналған "Таза ауа-Жанға дауа" Алматы қаласының экологиялық ахуалуын сауықтырудың кешендi бағдарламасын бекiту туралы" I-сайланған Алматы қалалық Мәслихатының 1999 жылғы 14 мамырдағы  XXV-сессиясының шешiмiне қосымшаның 1.11.1  тармағының 3, 4, 5 тармақшаларының күшiн 2015 жылға дейiн уақытша тоқтата тұру туралы Әдiлет басқармасында 11.06.99 жылы N 57 болып тiркелген, II-сайланған Алматы қалалық Мәслихатының 31.10.2001 жылғы XIII-i сессиясының, (20.11.2001 N 404 болып тiркелдi), 23.01.2002 жылғы ХV-i сессиясының (22.02.2002 N 436 болып тiркелдi), шешiмдерiмен өзгерiстер мен толықтырулар енгiзiлдi 03.01. 2001 жылы, 6.03.2002 жылы "Вечерний Алматы", 03.11. 2002 жылы "Алматы Ақшамы" газеттерiнде жарияланды'
