act_code: '22402'
requisite: Решение XI сессии маслихата города Алматы III-го созыва N 92 от 9 декабря 2004 года. Зарегистрировано Департаментом юстиции города Алматы 24 декабря 2004 года за N 633. Утратило силу в связи с истечением срока действия - письмо маслихата города Алматы от 29 декабря 2005 года N 1305
title:
  rus: Об утверждении ставок платы за загрязнение окружающей среды, размеров компенсационной (восстановительной) стоимости вынужденного сноса зеленых насаждений по городу Алматы и ставок платы за использование особо охраняемой природной территории на 2005 год
  kaz: 2005 жылға арналған Алматы қаласы бойынша қоршаған ортаны ластағаны үшiн төлемдер мөлшерлемелерiн, жасыл желектердi ерiксiз кескенi үшiн өтемдiк (қалпына келтiру) құнын және ерекше қорғалатын табиғи аумақтарды пайдаланғаны үшiн төлемдер мөлшерлемелерiн бекiту туралы
