  requisite: Решение XVII сессии Маслихата города Алматы III-го созыва от 29 июля 2005 года N 173. Зарегистрировано Департаментом юстиции города Алматы 10 августа 2005 года за N 667. Утратило силу в связи с истечением срока действия - письмо Маслихата города Алматы от 20 января 2006 года N 103
  title:
    rus: О внесении изменения в решение N 92 XI-й сессии Маслихата города Алматы III-го созыва от 9 декабря 2004 года "Об утверждении ставок платы за загрязнение окружающей среды, размеров компенсационной (восстановительной) стоимости вынужденного сноса зеленых насаждений по городу Алматы и ставок платы за использование особо охраняемой природной территории на 2005 год"
    kaz: III-сайланған Алматы қаласы Мәслихатының 2004 жылғы 9 желтоқсандағы XI сессиясының "2005 жылға арналған Алматы қаласы бойынша қоршаған ортаны ластағаны үшін төлемдер мөлшермелерін, жасыл желектерді еріксіз кескені үшін өтемдік (қалпына келтіру) құнын және ерекше қорғалатын табиғи аумақтарды пайдаланғандығы үшін төлемдер мөлшермелерін бекіту туралы" N 92 шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/25005/rus
